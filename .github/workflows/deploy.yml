name: CD — Deploy to Production

on:
  push:
    branches:
      - main

  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via FTPS to Production Server
    runs-on: ubuntu-latest

    # Only deploy when CI passes (if triggered via workflow_run)
    if: >
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for FTP Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "Secrets are not set. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via FTP
        if: steps.check_secrets.outputs.skip == 'false'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:          ${{ secrets.FTP_SERVER }}
          username:        ${{ secrets.FTP_USERNAME }}
          password:        ${{ secrets.FTP_PASSWORD }}
          server-dir:      ${{ secrets.FTP_SERVER_DIR }}
          protocol:        ftps
          port:            21
          log-level:       verbose
          # Exclude files that must NOT go to production
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            config/config.local.php
            database/sample-data.sql
            scripts/**
            *.log
            .DS_Store
            Thumbs.db

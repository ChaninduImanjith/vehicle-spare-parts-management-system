name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate PHP, JavaScript and Database Schema
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --ssl-mode=DISABLED"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Check PHP syntax
        shell: bash
        run: |
          find .                 -type f                 -name "*.php"                 -not -path "./vendor/*"                 -print0 | xargs -0 -r -n1 php -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets/js                 -type f                 -name "*.js"                 -print0 | xargs -0 -r -n1 node --check

      - name: Validate MySQL schema
        env:
          MYSQL_PWD: root
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --ssl-mode=DISABLED \
            --default-character-set=utf8mb4 \
            < database/schema.sql

      - name: CI completed
        run: echo "All CI validation checks passed."
